plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    compileOnly "dev.isxander:yet-another-config-lib:${yacl_version}-neoforge"
    compileOnly "maven.modrinth:entitytexturefeatures:${etf_version}-neoforge-26.2"
    compileOnly "maven.modrinth:entity-model-features:${emf_version}-neoforge-26.2"
    compileOnly "maven.modrinth:reliable-remover:${reliable_remover_version}-neoforge"
    //compileOnly "maven.modrinth:exposure:${exposure_neoforge_version}"
    //compileOnly "maven.modrinth:mixed-litter:${mixed_litter_version}"
    //compileOnly "com.cobblemon:neoforge:${cobblemon_version}"
    //compileOnly "maven.modrinth:serene-seasons:${serene_seasons_neoforge_version}"
    //compileOnly "maven.modrinth:scholar:t5aJhKGV"
    compileOnly "maven.modrinth:item-descriptions:${item_descriptions_version}-neoforge"

    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}

sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}