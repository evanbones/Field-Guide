plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // RRV
    runtimeOnly("cc.cassian.rrv:reliable-recipe-viewer-fabric:${rrv_version}") {
        transitive = false
    }

    // YACL
    implementation "dev.isxander:yet-another-config-lib:${yacl_version}-fabric"
    implementation "com.terraformersmc:modmenu:${mod_menu_version}"

    // Item Descriptions
    implementation "maven.modrinth:item-descriptions:${item_descriptions_version}-fabric"

    // Immersive Overlays
    runtimeOnly "maven.modrinth:immersive-overlays:${immersive_overlays_version}-fabric"

    // Spyglass Improvements
    //runtimeOnly "maven.modrinth:spyglass-improvements:${spyglass_improvements_version}+fabric"

    // ETF & EMF
    compileOnly "maven.modrinth:entitytexturefeatures:${etf_version}-fabric-26.2"
    compileOnly "maven.modrinth:entity-model-features:${emf_version}-fabric-26.2"

    // Reliable Remover
    compileOnly "maven.modrinth:reliable-remover:${reliable_remover_version}-fabric"

    // Exposure
    //implementation "maven.modrinth:exposure:${exposure_fabric_version}"
    //implementation "maven.modrinth:forge-config-api-port:${fcapi_version}-Fabric"

    // Cobblemon
    //compileOnly "com.cobblemon:fabric:${cobblemon_version}"

    // Serene Seasons
    //compileOnly "maven.modrinth:serene-seasons:${serene_seasons_fabric_version}"

    // Fabric Seasons
    //compileOnly "maven.modrinth:fabric-seasons:${fabric_seasons_version}"
    //runtimeOnly "maven.modrinth:fabric-seasons:${fabric_seasons_version}"

    // Scholar
    //implementation "maven.modrinth:scholar:MpMbLKGR"
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}

sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

publishMods {
    file = tasks.named("jar").flatMap { it.archiveFile }
}