plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")

    // EMI
    modCompileOnly "dev.emi:emi-fabric:${emi_version}"
    modRuntimeOnly "dev.emi:emi-fabric:${emi_version}"

    // Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modImplementation "com.terraformersmc:modmenu:${mod_menu_version}"

    // Item Descriptions
    modRuntimeOnly "folk.sisby:kaleido-config:${kaleido_config_version}"
    modImplementation "maven.modrinth:item-descriptions:${item_descriptions_version}-fabric"

    // Immersive Overlays
    modRuntimeOnly "maven.modrinth:immersive-overlays:${immersive_overlays_version}-fabric"

    // Spyglass Improvements
    modRuntimeOnly "maven.modrinth:spyglass-improvements:${spyglass_improvements_fabric_version}+fabric"

    // ETF/EMF
    modCompileOnly "maven.modrinth:entitytexturefeatures:${etf_version}-fabric-1.20.1"
    modCompileOnly "maven.modrinth:entity-model-features:${emf_version}-fabric-1.20.1"

    // Reliable Remover
    modCompileOnly "maven.modrinth:reliable-remover:${reliable_remover_version}-fabric"

    // Exposure
    modImplementation "maven.modrinth:exposure:${exposure_fabric_version}"
    modImplementation "maven.modrinth:forge-config-api-port:${fcapi_version}-Fabric"

    // Cobblemon
    modCompileOnly "com.cobblemon:fabric:${cobblemon_version}"

    // KubeJS
    modCompileOnly "maven.modrinth:kubejs:${kubejs_fabric_version}"

    // Serene Seasons
    modCompileOnly "maven.modrinth:serene-seasons:${serene_seasons_fabric_version}"

    // Fabric Seasons
    modCompileOnly "maven.modrinth:fabric-seasons:${fabric_seasons_version}"
    modRuntimeOnly "maven.modrinth:fabric-seasons:${fabric_seasons_version}"

    // Scholar
    modImplementation "maven.modrinth:scholar:FKPdCnvI"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

publishMods {
    file = tasks.named("remapJar").flatMap { it.archiveFile }
}