modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/evanbones/FieldGuide/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
logoFile = "${mod_id}.png"
iconFile = "${mod_id}.png"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''
rrv_client = "com.evandev.fieldguide.compat.rrv.FieldGuideRrvPlugin"

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "entity_texture_features"
type = "optional"
versionRange = "[7.2,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "entity_model_features"
type = "optional"
versionRange = "[3.3,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "item_descriptions"
type = "optional"
versionRange = "[2.8.0,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "immersiveoverlays"
type = "optional"
versionRange = "[1.7.5,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "yet_another_config_lib_v3"
type = "optional"
versionRange = "[${yacl_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "rrv"
type = "optional"
versionRange = "[8.0.0,)"
ordering = "AFTER"
side = "CLIENT"
