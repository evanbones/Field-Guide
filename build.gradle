plugins {
    id 'net.fabricmc.fabric-loom-remap' version "1.16-SNAPSHOT" apply false
    id 'net.neoforged.moddev' version '2.0.140' apply false
    id 'org.moddedmc.wiki.toolkit' version '0.4.1'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1' apply false
}

wiki {
    wikiAccessToken = System.getenv("WIKI_ACCESS_TOKEN")
    docs.create("field-guide") {
        root = file("docs/")
    }
}