name: Bug Report
description: Create a bug report to help us improve the mod.
labels: [ "bug" ]
body:
  - type: textarea
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction Steps
      description: Tell us about the steps to reproduce the bug
      value: |
        1. 
        2. 
        3.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Expected Result
      description: A clear and concise description of what you expected to happen
    validations:
      required: false
  - type: textarea
    attributes:
      label: Screenshots and Videos
      description: If applicable, add screenshots or videos to help explain your problem
    validations:
      required: false
  - type: input
    attributes:
      label: Operating System
      description: The operating system you were using when the bug occurred
      placeholder: Windows 11, macOS, Linux
    validations:
      required: false
  - type: dropdown
    attributes:
      label: Mod Version
      description: The version of the mod you were using
      options:
        - "1.7.4"
        - "1.7.3"
        - "1.7.2"
        - "1.7.1"
        - "1.7.0"
        - "1.6.9"
        - "1.6.8"
        - "1.6.7"
        - "1.6.6"
        - "1.6.5"
        - "1.6.4"
        - "1.6.3"
        - "1.6.2"
        - "1.6.1"
        - "1.6.0"
        - "1.5.15"
        - "1.5.14"
        - "1.5.13"
        - "1.5.12"
        - "1.5.11"
        - "1.5.10"
        - "1.5.9"
        - "1.5.8"
        - "1.5.7"
        - "1.5.6"
        - "1.5.5"
        - "1.5.4"
        - "1.5.3"
        - "1.5.2"
        - "1.5.1"
        - "1.5.0"
        - "1.4.1"
        - "1.4.0"
        - "1.3.0"
        - "1.2.1"
        - "1.2.0"
        - "1.1.3"
        - "1.1.2"
        - "1.1.1"
        - "1.1.0"
        - "1.0.3"
        - "1.0.2"
        - "1.0.1"
        - "1.0.0"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Minecraft Version
      description: The version of Minecraft you were using
      options:
        - "26.1"
        - "1.21.1"
        - "1.20.1"
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Mod Loader
      description: Which mod loader were you using?
      options:
        - "Forge"
        - "Fabric"
        - "NeoForge"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Other Mods / Modpack
      description: Please list other mods or the name of the modpack you are running.
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional Context
      description: Attach crash reports or logs here (use Pastebin or similar if long).
    validations:
      required: false
  - type: markdown
    attributes:
      value: "Thank you for taking the time to fill out this bug report!"